<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Styles.css">
    <title>Create Account/Login</title>
</head>

<body class="body_LoginPage">
<div class="auth-container">
    <div class="tabs">
        <button class="tab active" onclick="showForm('login')">Login</button>
        <button class="tab" onclick="showForm('signup')">Sign Up</button>
    </div>

    <div id="login" class="form active">
        <h2>Welcome Back</h2>
        <input type="text" placeholder="Username">
        <input type="password" placeholder="Password">
        <button class="button_LoginPage">Login</button>
    </div>

    <div id="signup" class="form">
        <h2>Create Account</h2>
        <input type="text" placeholder="Username">
        <input type="email" placeholder="Email">
        <input type="password" placeholder="Password">
        <button class="button_SignUpPage">Sign Up</button>
    </div>
</div>
    <a href="index.html" class="Go_Back">
        <p>Go Back</p>
    </a>
</body>
<script src="javascript.js"></script>
</html>
